name: Test

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

jobs:
  test:
    name: Theory tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 'lts/*'
      - name: Run tests
        run: npm test

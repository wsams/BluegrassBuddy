<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Scale charts — BluegrassBuddy</title>
  <script src="js/theme-boot.js"></script>
  <link rel="icon" href="assets/favicon.svg"/>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html">
      <span class="brand-mark" aria-hidden="true">𝄞</span>
      <span class="brand-text">Bluegrass<span>Buddy</span></span>
    </a>
    <div class="header-end">
      <div class="theme-toggle" role="group" aria-label="Theme">
        <button type="button" data-theme-choice="light" aria-pressed="false">Light</button>
        <button type="button" data-theme-choice="dark" aria-pressed="true">Dark</button>
      </div>
      <button class="nav-toggle" type="button" aria-label="Menu" aria-expanded="false">☰</button>
      <nav class="site-nav">
      <a href="index.html">Home</a>
      <a href="capo.html">Capo</a>
      <a href="charts.html">Charts</a>
      <a href="scales.html">Scales</a>
      <a href="jam.html">Jam</a>
      <a href="songs.html">Songs</a>
      <a href="sheet.html">Sheet</a>
      <a href="instruments.html">Instruments</a>
    </nav>
    </div>
  </header>
  <main class="wrap">
    <h1>Scales</h1>

    <div class="panel controls">
      <label class="field">Major key
        <select id="scale-key"></select>
      </label>
      <label class="field">Scale
        <select id="scale-type"></select>
      </label>
    </div>
    <p class="hint" id="scale-hint"></p>

    <div class="tabs" data-tabs data-tabs-param="tab">
      <div class="tab-list" role="tablist" aria-label="Scale views">
        <button type="button" role="tab" data-tab="neck">Neck</button>
        <button type="button" role="tab" data-tab="boxes">Boxes</button>
      </div>
      <div class="tab-panels">
        <section role="tabpanel" data-tab-panel="neck">
          <div id="scale-strip" class="card"></div>
          <div class="card" style="margin-top:1rem" id="full-neck"></div>
          <p class="muted" style="margin-top:1.4rem">
            Spellings for every jam key live on the
            <a href="charts.html?tab=scales">scale charts</a> table.
          </p>
        </section>
        <section role="tabpanel" data-tab-panel="boxes">
          <div id="boxes-wrap">
            <h2>The five pentatonic boxes in this key</h2>
            <div id="boxes" class="grid grid-2"></div>
          </div>
        </section>
      </div>
    </div>
  </main>
  <footer class="site-footer">
    <div class="footer-inner">
      <span>© <span data-year></span> BluegrassBuddy</span>
      <span>Major pentatonic = relative minor pentatonic. Capo is just transposition.</span>
    </div>
  </footer>
  <script type="module" src="js/app.js"></script>
  <script type="module" src="js/page-scales.js"></script>
</body>
</html>
